# Pneumonia: official train/test split (no merge → no patient leakage).
# Requires: data4/train and data4/test from scripts/create_pneumonia_dataset.py
data_dir_train: data4/train
data_dir_test: data4/test
data_ratio: 1.0
test_ratio: 0.3
experiment_type: baseline
dropout_rate: 0
epochs: 2
batch_size: 16
lr: 0.01
momentum: 0.09
plot_path_train: all_plots/pneumonia_baseline_plot/train_plots.png
plot_path_test: all_plots/pneumonia_baseline_plot/test_plots.png
plot_confusion: all_plots/pneumonia_baseline_plot/confusion_matrix.png
report_path: all_plots/pneumonia_baseline_plot/report.txt
accuracy_path: all_plots/pneumonia_baseline_plot/accuracy.txt
