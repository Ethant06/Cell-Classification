# Cell limited-data experiment with rotation, flipping, and random erasing.
# Data and fixed train/test split settings.
data_dir: data2/
data_ratio: 0.35
test_ratio: 0.3
experiment_type: small_aug_reg
# Model and SGD hyperparameters. Random erasing is selected by experiment_type.
dropout_rate: 0
epochs: 10
batch_size: 16
lr: 0.01
momentum: 0.09
# First-seed report and per-seed accuracy output directory.
report_path: all_plots/subset_aug_reg_plot/report.txt
accuracy_path: all_plots/subset_aug_reg_plot/accuracy.txt
