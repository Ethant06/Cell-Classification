# Pneumonia limited-data experiment with random erasing only.
# Data and fixed train/test split settings.
data_dir: data4/
data_ratio: 0.35
test_ratio: 0.3
experiment_type: small_erase
# Model and SGD hyperparameters.
dropout_rate: 0
epochs: 10
batch_size: 16
lr: 0.01
momentum: 0.09
# First-seed report and per-seed accuracy output directory.
report_path: all_plots/pneumonia_flat_subset_erase_plot/report.txt
accuracy_path: all_plots/pneumonia_flat_subset_erase_plot/accuracy.txt
