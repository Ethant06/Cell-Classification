# Pneumonia: flat data4/ (class folders), limited train subset (35%), no augmentation — baseline for limited-data runs.
data_dir: data4/
data_ratio: 0.35
test_ratio: 0.3
experiment_type: pneumonia_subset_baseline
dropout_rate: 0
epochs: 15
batch_size: 16
lr: 0.01
momentum: 0.09
plot_path_train: all_plots/pneumonia_subset_baseline/train_plots.png
plot_path_test: all_plots/pneumonia_subset_baseline/test_plots.png
plot_confusion: all_plots/pneumonia_subset_baseline/confusion_matrix.png
report_path: all_plots/pneumonia_subset_baseline/report.txt
accuracy_path: all_plots/pneumonia_subset_baseline/accuracy.txt
