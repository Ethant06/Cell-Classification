# Pneumonia limited-data baseline: 35% of training data, no augmentation or dropout.
# Data and fixed train/test split settings.
data_dir: data4/
data_ratio: 0.35
test_ratio: 0.3
experiment_type: pneumonia_subset_baseline
# Model and SGD hyperparameters.
dropout_rate: 0
epochs: 10
batch_size: 16
lr: 0.01
momentum: 0.09
# First-seed report and per-seed accuracy output directory.
report_path: all_plots/pneumonia_subset_baseline/report.txt
accuracy_path: all_plots/pneumonia_subset_baseline/accuracy.txt
