# configuration for CNN experiment using full dataset and without any data augmentation/regularization
data_dir: data2/
data_ratio: 0.7
test_ratio: 0.3
experiment_type: baseline
# After training, saves weights once (first seed only). Path is relative to cwd when you run main.py.
model_save_path: checkpoints/pca_cnn_trained.pth
dropout_rate: 0
epochs: 10
batch_size: 16
lr: 0.01
momentum: 0.09
plot_path_train: all_plots/baseline_plot/train_plots.png
plot_path_test: all_plots/baseline_plot/test_plots.png
plot_confusion: all_plots/baseline_plot/confusion_matrix.png
report_path: all_plots/baseline_plot/report.txt
accuracy_path: all_plots/baseline_plot/accuracy.txt