# Cell full-training baseline: no augmentation and no dropout.
# Data and fixed train/test split settings.
data_dir: data2/
data_ratio: 0.7
test_ratio: 0.3
experiment_type: baseline
# Model and SGD hyperparameters.
dropout_rate: 0
epochs: 10
batch_size: 16
lr: 0.01
momentum: 0.09
# First-seed report and per-seed accuracy output directory.
report_path: all_plots/baseline_plot/report.txt
accuracy_path: all_plots/baseline_plot/accuracy.txt